name: BiasLens landing CI

on:
  push:
    branches:
      - feature/biaslens-public-landing
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
